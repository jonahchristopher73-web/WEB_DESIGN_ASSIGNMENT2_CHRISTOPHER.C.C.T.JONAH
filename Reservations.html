<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations | Carson's Italian Spaghetti</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="logo">CIS <span>Carson's Italian Spaghetti</span></div>
      <button class="menu-btn" onclick="this.nextElementSibling.classList.toggle('open')">☰</button>
      <nav>
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="reservations.html" class="active">Reservations</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="reserve-box">
      <h1>Reserve Your Own Table</h1>
      <p class="sub">You are our priority</p>

      <form onsubmit="event.preventDefault(); alert('Reservation request sent! We will confirm soon.');">
        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label for="time">Time:</label>
          <input type="time" id="time" required>
        </div>
        <div class="form-group">
          <label for="people">Number of People:</label>
          <input type="number" id="people" min="1" max="12" required placeholder="e.g. 2">
        </div>
        <div class="form-group">
          <label for="request">Special Request (Optional)</label>
          <textarea id="request" placeholder="Any special requests..."></textarea>
        </div>
        <button type="submit" class="btn confirm-btn">Confirm</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-line">
      <strong>CIS</strong> | Wilkinson Road | 0732 68562
    </div>
    <div class="socials">
      <span>TT</span>
      <span>IG</span>
      <span>X</span>
    </div>
  </footer>
</body>
</html>
